# CI/CD Production Deploy: при кожному push у main
#   1) check  — збирає Tailwind CSS, перевіряє, що зібраний файл закомічено, перевіряє JS, посилання та SEO-теги;
#   2) deploy — якщо перевірки пройшли, деплоїть сайт на Vercel через Vercel CLI.
# Потрібні секрети репозиторію (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: CI/CD Production Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Перевірка коду
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Compiled CSS is up to date
        run: git diff --exit-code css/tailwind.css || (echo "::error::css/tailwind.css застарів — виконайте npm run build:css і закомітьте файл" && exit 1)

      - name: Check JS, links and SEO tags
        run: npm run check:js

  deploy:
    name: Деплой на Vercel
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kubyky-karty.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрети Vercel не задано — крок деплою пропущено"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        if: steps.secrets.outputs.ok == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        if: steps.secrets.outputs.ok == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
